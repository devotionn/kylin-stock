name: Generate Dependency Lockfiles

on:
  push:
    branches: [chore/reproducible-builds]

permissions:
  contents: write

jobs:
  generate-lockfiles:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/reproducible-builds

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Verify lockfiles exist
        run: |
          test -s package-lock.json
          test -s src-tauri/Cargo.lock
          npm ci --ignore-scripts --no-audit --no-fund
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps > /dev/null

      - name: Commit resolved lockfiles to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lockfiles already match the resolved dependency graph.'
          else
            git commit -m 'build: lock Node and Rust dependencies'
            git push origin HEAD:chore/reproducible-builds
          fi

      - name: Upload resolved lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: kylin-stock-resolved-lockfiles
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
