name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate OCR worker syntax
        run: python3 -m py_compile src-tauri/resources/ocr_worker.py

      - name: Run OCR geometry parser regression
        run: python3 tests/test_ocr_worker.py

      - name: TypeScript and Vite build
        run: npm run build

      - name: Rust compile check with locked dependencies
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  arm64-ocr-runtime-smoke:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 ARM64
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: arm64
          cache: pip
          cache-dependency-path: src-tauri/resources/requirements-ocr.txt

      - name: Confirm native Python architecture
        run: |
          python - <<'PY'
          import platform
          import sys
          machine = platform.machine().lower()
          print(sys.version)
          print(machine)
          assert machine in {'aarch64', 'arm64'}, machine
          PY

      - name: Install locked OCR runtime
        run: python -m pip install -r src-tauri/resources/requirements-ocr.txt

      - name: RapidOCR runtime self-check
        run: rapidocr check

  arm64-package-smoke:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm native architecture
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify locked Rust dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps > /dev/null

      - name: Build native ARM64 deb smoke package
        run: npm run tauri:build -- --bundles deb

      - name: Verify Debian package metadata
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          ls -lah "$DEB"
          dpkg-deb --info "$DEB"

          PACKAGE="$(dpkg-deb --field "$DEB" Package)"
          VERSION="$(dpkg-deb --field "$DEB" Version)"
          ARCH="$(dpkg-deb --field "$DEB" Architecture)"
          DEPENDS="$(dpkg-deb --field "$DEB" Depends)"

          printf 'Package=%s\nVersion=%s\nArchitecture=%s\nDepends=%s\n' \
            "$PACKAGE" "$VERSION" "$ARCH" "$DEPENDS"

          test "$PACKAGE" = "kylin-stock"
          test "$ARCH" = "arm64"
          test -n "$VERSION"

      - name: Install generated ARM64 deb
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          sudo dpkg -i "$DEB"

          STATUS="$(dpkg-query -W -f='${db:Status-Status}' kylin-stock)"
          VERSION="$(dpkg-query -W -f='${Version}' kylin-stock)"
          ARCH="$(dpkg-query -W -f='${Architecture}' kylin-stock)"
          printf 'Installed status=%s version=%s arch=%s\n' "$STATUS" "$VERSION" "$ARCH"
          test "$STATUS" = "installed"
          test "$ARCH" = "arm64"

      - name: Verify installed executable and desktop entry
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(command -v kylin-stock)"
          test -x "$BIN"
          file "$BIN"

          if ldd "$BIN" | grep -F 'not found'; then
            echo 'Missing shared library detected' >&2
            exit 1
          fi

          DESKTOP="$(find /usr/share/applications -maxdepth 1 -type f -iname '*kylin*stock*.desktop' -print -quit)"
          test -n "$DESKTOP"
          printf 'Desktop entry: %s\n' "$DESKTOP"
          cat "$DESKTOP"
          grep -Fx 'Name=物资管理系统' "$DESKTOP"
          grep -Eq '^Exec=.*kylin-stock' "$DESKTOP"

      - name: Upload ARM64 smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylin-stock-arm64-ubuntu22-smoke-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
